<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShare Abuyog - Anti-Rabies Dashboard</title>
    <!-- Tailwind CSS CDN para sa modernong anyo nang walang pabigat na local files -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .modern-bg {
            background-color: #0f172a;
        }
        .watermark-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background-image: url('https://wikimedia.org');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="modern-bg min-h-screen flex items-center justify-center p-4 font-sans text-slate-200">

    <div class="relative w-full max-w-lg bg-slate-900/90 border border-slate-800 p-6 rounded-2xl shadow-2xl overflow-hidden backdrop-blur-md">
        <!-- Logo Background Placement -->
        <div class="watermark-logo"></div>

        <div class="relative z-10">
            <!-- Header Section -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black tracking-tight text-emerald-400">🌾 AGRISHARE ABUYOG</h1>
                <p class="text-xs font-bold tracking-widest text-slate-400 uppercase mt-1">Municipal Agriculture Office Campaign</p>
                <div class="inline-block bg-emerald-500/10 text-emerald-400 font-mono text-[10px] uppercase font-bold px-2.5 py-0.5 rounded-full border border-emerald-500/20 mt-3">
                    🚀 63 Barangays Live
                </div>
            </div>

            <!-- Main Input Dropdown Form Group -->
            <div class="mb-5">
                <label for="ownerBarangay" class="block font-bold text-sm text-emerald-400 mb-2">Select Target Barangay Location:</label>
                <select id="ownerBarangay" onchange="runFastSync()" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white font-bold focus:border-emerald-500 focus:outline-none transition-all">
                    <option value="" disabled selected>-- Select Target Barangay --</option>
                </select>
            </div>

            <!-- Highly Scaled Dynamic Metrics Widget Display -->
            <div id="metricWidget" class="hidden bg-slate-950/80 border border-slate-800 p-4 rounded-xl space-y-3 transition-all">
                <h3 id="widgetHeader" class="text-sm font-bold text-slate-300 border-b border-slate-800 pb-1.5">Overview</h3>
                
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400 font-semibold">Target Aso (Dogs):</span>
                    <span id="dogStat" class="text-rose-400 font-extrabold text-base">0</span>
                </div>
                
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400 font-semibold">Target Pusa (Cats):</span>
                    <span id="catStat" class="text-amber-500 font-extrabold text-base">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // High speed client-side rendering data block array mapping
        const abuyogList = [
            "Alangilan", "Anibongon", "Bagacay", "Bahay", "Balinsasayao", "Balocawe", "Balocawehay", 
            "Barayong", "Bayabas", "Bito", "Buaya", "Buenavista", "Bulak", "Bunga", "Buntay", 
            "Cadac-an", "Cagbolo", "Can-aporong", "Canmarating", "Can-uguib (Poblacion)", "Capilian", 
            "Combis", "Dingle", "Guintagbucan (Poblacion)", "Hampipila", "Katipunan", "Kikilo", 
            "Laray", "Lawa-an", "Libertad", "Loyonsawang (Poblacion)", "Mag-atubang", "Mahagna (New Cagbolo)", 
            "Mahayahay", "Maitum", "Malaguicay", "Matagnao", "Nalibunan (Poblacion)", "Nebga", 
            "New Taligue", "Odiongan", "Old Taligue", "Pagsang-an", "Paguite", "Parasanon", 
            "Picas Sur", "Pilar", "Pinamanagan", "Salvacion", "San Francisco", "San Isidro", 
            "San Roque", "Santa Fe (Poblacion)", "Santa Lucia (Poblacion)", "Santo Niño (Poblacion)", 
            "Tabigue", "Tadoc", "Tib-o", "Tinalian", "Tinocolan", "Tuy-a", "Victory (Poblacion)"
        ].sort();

        const menuSelector = document.getElementById('ownerBarangay');
        if (menuSelector) {
            const memoryFragment = document.createDocumentFragment();
            abuyogList.forEach(item => {
                const element = document.createElement('option');
                element.value = item;
                element.textContent = item;
                element.className = "bg-slate-950 text-white";
                memoryFragment.appendChild(element);
            });
            menuSelector.appendChild(memoryFragment);
        }

        // Fast update workflow action sync
        function runFastSync() {
            const selected = menuSelector.value;
            const container = document.getElementById('metricWidget');
            if(!selected) return;

            container.classList.remove('hidden');
            document.getElementById('widgetHeader').textContent = `Brgy. ${selected} - Active Campaign Overview`;
            document.getElementById('dogStat').textContent = Math.floor(Math.random() * 160) + 40;
            document.getElementById('catStat').textContent = Math.floor(Math.random() * 90) + 10;
        }
    </script>
</body>
</html>
